name: CI
on:
  push:
  pull_request:
jobs:
  distribution:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m pip install dist/paperrule-0.1.0-py3-none-any.whl httpx
      - run: python -c "from pathlib import Path; Path('.test-tmp').mkdir(exist_ok=True)"
      - run: python scripts/wheel_smoke.py dist/paperrule-0.1.0-py3-none-any.whl --temporary-root .test-tmp
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,ingest]'
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts setup.py
      - run: python scripts/privacy_check.py
      - run: python scripts/history_privacy_check.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[dev,ingest]'
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e -- --global-timeout=120000
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: .test-tmp/playwright-results
          if-no-files-found: ignore
