[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperrule"
version = "0.1.0"
description = "Private, auditable writing rules for AI-assisted academic writing"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.8,<3", "typer>=0.12,<1", "rich>=13,<15", "uvicorn>=0.30,<1", "platformdirs>=4,<5"]

[project.optional-dependencies]
ingest = ["PyMuPDF>=1.24,<2", "python-docx>=1.1,<2"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[project.scripts]
paperrule = "paperrule.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
